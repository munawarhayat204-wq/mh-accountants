<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookkeeping Workbook</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#14284b;--mut:#6b7a93;--line:#e3e9f3;--a:#3f5e8c;--a2:#7f9cc7;--a3:#c4d3ea;--nv:#14284b;--o:#f58a00;--soft:#f4f7fc;--up:#2f8f6b;--dn:#c0505a;--in:#fff9d6;--sh:0 1px 2px rgba(20,40,75,.05),0 10px 30px rgba(20,40,75,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1626;--card:#142038;--ink:#e8eef9;--mut:#8fa1bf;--line:#223252;--a:#7f9cc7;--a2:#4f6f9f;--a3:#2a3d5f;--nv:#9fb6d9;--o:#ff9f1a;--soft:#101b30;--in:#1d2b47;--sh:0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0d1626;--card:#142038;--ink:#e8eef9;--mut:#8fa1bf;--line:#223252;--a:#7f9cc7;--a2:#4f6f9f;--a3:#2a3d5f;--nv:#9fb6d9;--o:#ff9f1a;--soft:#101b30;--in:#1d2b47;--sh:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
header img{height:44px;display:block;animation:pop .8s cubic-bezier(.2,.9,.3,1.2) both}@keyframes pop{from{transform:translateY(10px) scale(.85);opacity:0}}
h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.02em}.sub{font-size:12px;color:var(--mut)}.sp{flex:1}
button{font:inherit;cursor:pointer}
.btn{font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;box-shadow:var(--sh)}
.btn.p{background:var(--a);color:#fff;border-color:var(--a)}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;box-shadow:var(--sh);margin-bottom:16px;scrollbar-width:none}
nav button{border:0;background:none;color:var(--mut);font-weight:700;font-size:13px;padding:9px 16px;border-radius:99px;white-space:nowrap;transition:.2s}nav button.on{background:var(--o);color:#14284b}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--sh);border:1px solid var(--line);min-width:0;animation:rise .5s both}@keyframes rise{from{transform:translateY(12px);opacity:0}}
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1000px){.c3{grid-column:span 6}.c4,.c6,.c8{grid-column:span 12}}@media(max-width:560px){.c3{grid-column:span 12}}
.lbl{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}.big{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums}
h2{font-size:16px;margin:0 0 4px;font-weight:800}.hint{font-size:12px;color:var(--mut);margin-bottom:12px}
svg{display:block;width:100%;height:auto;overflow:visible}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--line);max-height:68vh}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:10px 8px;text-align:left;z-index:1}
td{padding:3px 6px;border-bottom:1px solid var(--line)}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.ed input,.ed select,.bar2 input,.set input{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:9px;padding:7px 8px;width:100%;min-width:90px}
.ed input:hover,.ed select:hover{background:var(--soft)}.ed input:focus,.ed select:focus,.bar2 input:focus,.set input:focus{outline:0;border-color:var(--a);background:var(--in)}
.ed input[type=number]{text-align:right}.ed select option{color:#14284b}
.x{border:0;background:none;color:var(--mut);font-size:14px;padding:6px 9px;border-radius:8px}.x:hover{background:var(--soft);color:var(--dn)}
.bar2,.set{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.bar2 label,.set label{font-size:12.5px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:8px}
.bar2 input,.set input{background:var(--in);border-color:var(--line);width:auto;min-width:130px}
.ok{color:var(--up);font-weight:800}.bad{color:var(--dn);font-weight:800}
.rep{max-width:760px;margin:0 auto}.rep .hd{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:6px}.rep .hd img{height:42px}.rep h2{margin:0}
.rep table td{padding:8px 6px}.rep .sec td{font-weight:800;font-size:11.5px;letter-spacing:.06em;color:var(--a);padding-top:16px;border-bottom:1px solid var(--a3)}
.rep .tot td{font-weight:800;border-top:1px solid var(--ink);background:var(--soft)}
.coa{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}@media(max-width:1000px){.coa{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.coa{grid-template-columns:1fr}}
.coa textarea{width:100%;height:420px;font:inherit;font-size:12.5px;line-height:1.7;background:var(--in);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px;resize:vertical}
.coa b{display:block;margin-bottom:6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--nv)}
.bar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;width:120px;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,var(--o));border-radius:99px}
.leg{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--mut);font-weight:600;margin-top:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:6px}
@media print{header,nav,.bar2,.set,.x,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}.tw{max-height:none;border:0}}
</style>
</head>

const row=(a,b,c)=>`<tr><td>${esc(a)}</td><td class="r">${f(b)}</td>${c==null?'':`<td class="r">${f(c)}</td>`}</tr>`;
const secH=t=>`<tr class="sec"><td colspan="3">${t}</td></tr>`;
const tot=(t,v)=>`<tr class="tot"><td>${t}</td><td class="r">${fm(v)}</td><td></td></tr>`;
function lines(L,m,skip,extra){let out='',T=0;(extra||[]).forEach(x=>{out+=row(x[0],x[1]);T+=x[1]});S.coa[m].forEach(s=>{if(skip&&skip.test(s))return;const v=bal(L,m,s);if(Math.abs(v)>.004){out+=row(s,v);T+=v}});return[out,T]}
// ---------- views ----------
function vDash(){const L=led(),m=monthly(),ks=Object.keys(m).sort(),cash=bal(L,'Assets','Cash at Bank'),R=party(L,'Assets','Receivable from '),P=party(L,'Liabilities','Payable to ');
 const rt=R.reduce((x,y)=>x+y[1],0),pt=P.reduce((x,y)=>x+y[1],0),inc=S.coa.Income.reduce((x,s)=>x+bal(L,'Income',s),0),ex=S.coa.Expenses.reduce((x,s)=>x+bal(L,'Expenses',s),0);
 const k=(l,v,d)=>`<div class="card c3"><div class="lbl">${l}</div><div class="big">${fm(v)}</div><div class="hint">${d}</div></div>`;
 const top=(a,t)=>`<table>${a.filter(x=>Math.abs(x[1])>.004).sort((x,y)=>y[1]-x[1]).slice(0,5).map(x=>`<tr><td>${esc(x[0])}</td><td class="r">${f(x[1])}</td></tr>`).join('')||'<tr><td class="hint">Nothing outstanding</td></tr>'}</table>`;
 const W=720,Hh=250,mx=Math.max(1,...ks.map(y=>Math.max(m[y].i,m[y].e)))*1.1,bw=(W-10)/Math.max(ks.length,1);let ch='';
 ks.forEach((y,i)=>{const x=10+i*bw+bw*.12,w=bw*.36,h1=m[y].i/mx*(Hh-50),h2=m[y].e/mx*(Hh-50);ch+=`<rect x="${x}" y="${Hh-30-h1}" width="${w}" height="${h1}" rx="8" fill="var(--a)"><animate attributeName="height" from="0" to="${h1}" dur=".9s" begin="${i*.1}s" fill="freeze"/><animate attributeName="y" from="${Hh-30}" to="${Hh-30-h1}" dur=".9s" begin="${i*.1}s" fill="freeze"/></rect><rect x="${x+w+4}" y="${Hh-30-h2}" width="${w}" height="${h2}" rx="8" fill="var(--a3)"/><text x="${x+w}" y="${Hh-10}" text-anchor="middle" font-size="11" fill="var(--mut)">${M[+y.slice(5)-1]} ${y.slice(2,4)}</text>`});
 const cats=S.coa.Expenses.map(s=>[s,bal(L,'Expenses',s)]).filter(x=>x[1]>.004).sort((a,b)=>b[1]-a[1]),cols=['#14284b','#3f5e8c','#6f8fbd','#9fb6d9','#bccbe3','#dbe4f2'],C=2*Math.PI*60;let o=0,ds='',lg='';
 cats.slice(0,6).forEach((c,i)=>{const l=c[1]/ex*C;ds+=`<circle r="60" cx="85" cy="85" fill="none" stroke="${cols[i]}" stroke-width="22" stroke-dasharray="${Math.max(l-3,1)} ${C}" stroke-dashoffset="${-o}" transform="rotate(-90 85 85)" stroke-linecap="round"/>`;o+=l;lg+=`<span><i style="background:${cols[i]}"></i>${esc(c[0])} · ${(c[1]/ex*100).toFixed(0)}%</span>`});
 const last=S.bank.map((t,i)=>[t,i]).sort((a,b)=>(b[0][0]||'').localeCompare(a[0][0]||'')||b[1]-a[1]).slice(0,5);
 return `<div class="g"><div class="card c3">${''}<div class="lbl">Current bank balance</div><div class="big">${fm(cash)}</div><div class="hint">${esc(S.cur)}</div></div>${k('Total receivables',rt,'Money owed to you')}${k('Total payables',pt,'Money you owe')}${k('Net profit',profit(L),'Income '+f(inc)+' · Expenses '+f(ex))}
 <div class="card c8"><h2>Income vs expenses</h2><div class="hint">By month, from dated transactions</div><svg viewBox="0 0 ${W} ${Hh}">${ch}</svg><div class="leg"><span><i style="background:var(--a)"></i>Income</span><span><i style="background:var(--a3)"></i>Expenses</span></div></div>
 <div class="card c4"><h2>Expense mix</h2><div class="hint">Share of total expenses</div><svg viewBox="0 0 170 170" style="max-width:190px;margin:auto">${ds}<text x="85" y="82" text-anchor="middle" font-size="11" fill="var(--mut)" font-weight="700">EXPENSES</text><text x="85" y="102" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${f(ex)}</text></svg><div class="leg">${lg}</div></div>
 <div class="card c4"><h2>Top 5 receivables</h2><div class="hint">Customers</div>${top(R)}</div><div class="card c4"><h2>Top 5 payables</h2><div class="hint">Suppliers</div>${top(P)}</div>
 <div class="card c4"><h2>Latest 5 bank transactions</h2><div class="hint">Most recent first</div><table>${last.map(([t])=>`<tr><td>${esc(t[1])}<div class="hint" style="margin:0">${esc(t[0]||'No date')}</div></td><td class="r ${n(t[3])?'ok':''}">${n(t[3])?'+'+f(n(t[3])):'−'+f(n(t[2]))}</td></tr>`).join('')}</table></div></div>`}
function vBank(){let run=n(S.open);return `<div class="card"><h2>Bank Statement</h2><div class="hint">Enter every bank transaction, or import a CSV / Excel statement (needs a Date, a Description and either Paid/Received columns or one Amount column). The bank account itself is implied — pick only the account it hits.</div><div class="bar2"><label>Opening bank balance <input type="number" step="0.01" value="${S.open}" data-s="open" data-num="1"></label><button class="btn p" data-a="addb">+ Add transaction</button><button class="btn" data-a="imp">⬆ Import statement</button><input type="file" id="fi" accept=".csv,.txt,.xlsx,.xls" hidden><span class="hint" style="margin:0">${S.bank.length} transactions</span></div>
 <div class="tw"><table class="ed"><thead><tr><th>Date</th><th>Description</th><th class="r">Paid (out)</th><th class="r">Received (in)</th><th>Main account</th><th>Sub account</th><th class="r">Running balance</th><th></th></tr></thead><tbody>${S.bank.map((t,i)=>{run+=n(t[3])-n(t[2]);return `<tr><td>${inp('bank',i,0,t[0],'date')}</td><td>${inp('bank',i,1,t[1])}</td><td>${inp('bank',i,2,t[2],'number')}</td><td>${inp('bank',i,3,t[3],'number')}</td><td>${sel(H,t[4],`data-t="bank" data-i="${i}" data-k="4"`)}</td><td>${sel(S.coa[t[4]]||[],t[5],`data-t="bank" data-i="${i}" data-k="5"`)}</td><td class="r">${f(run)}</td><td><button class="x" data-a="del" data-t="bank" data-i="${i}">✕</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function vJr(){const c={};S.jr.forEach(t=>c[t[0]]=(c[t[0]]||0)+(t[3]=='Debit'?n(t[4]):-n(t[4])));return `<div class="card"><h2>Adjustments (Journal)</h2><div class="hint">Non-bank double entries. Give every line of one transaction the same Txn No. — the check must read 0.</div><div class="bar2"><button class="btn p" data-a="addj">+ New transaction</button><button class="btn" data-a="addl">+ Add line to last</button></div>
 <div class="tw"><table class="ed"><thead><tr><th>Txn no.</th><th>Date</th><th>Description</th><th>Dr / Cr</th><th class="r">Amount</th><th>Main account</th><th>Sub account</th><th class="r">Check</th><th></th></tr></thead><tbody>${S.jr.map((t,i)=>{const k=`data-t="jr" data-i="${i}"`,v=Math.round(c[t[0]]*100)/100;return `<tr><td>${inp('jr',i,0,t[0],'number').replace('step="0.01"','step="1"')}</td><td>${inp('jr',i,1,t[1],'date')}</td><td>${inp('jr',i,2,t[2])}</td><td>${sel(['Debit','Credit'],t[3],k+' data-k="3"')}</td><td>${inp('jr',i,4,t[4],'number')}</td><td>${sel(H,t[5],k+' data-k="5"')}</td><td>${sel(S.coa[t[5]]||[],t[6],k+' data-k="6"')}</td><td class="r ${v==0?'ok':'bad'}">${f(v)}</td><td><button class="x" data-a="del" data-t="jr" data-i="${i}">✕</button></td></tr>`}).join('')}</tbody></table></div></div>`}
const vCoa=()=>`<div class="card"><h2>Chart of Accounts</h2><div class="hint">One account per line. Add “Receivable from [Name]” under Assets or “Payable to [Name]” under Liabilities to track a named customer or supplier. Every dropdown uses this list.</div><div class="coa">${H.map(h=>`<div><b>${h}</b><textarea data-c="${h}">${esc(S.coa[h].join('\n'))}</textarea></div>`).join('')}</div></div>`;
function vParty(m,pre,title,w){const L=led(),R=party(L,m,pre).filter(x=>true),T=R.reduce((x,y)=>x+y[1],0);return `<div class="card rep">${head(title)}<div class="g" style="margin:14px 0"><div class="card c12" style="box-shadow:none;background:var(--soft)"><div class="lbl">Total trade ${title.toLowerCase()}</div><div class="big">${fm(T)}</div></div></div><table><thead><tr><th>#</th><th>${w} name</th><th class="r">Balance</th><th class="r">% of total</th></tr></thead><tbody>${R.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x[0])}</td><td class="r">${f(x[1])}</td><td class="r">${T?(x[1]/T*100).toFixed(1)+'%':'–'}</td></tr>`).join('')||'<tr><td colspan="4" class="hint">None set up — add them on the Chart of Accounts sheet.</td></tr>'}</tbody></table></div>`}
function vPL(){const L=led(S.ps,S.pe),[a,A]=lines(L,'Income'),[b,B]=lines(L,'Expenses');return `<div class="card"><div class="set"><label>Company <input value="${esc(S.co)}" data-s="co"></label><label>From <input type="date" value="${S.ps}" data-s="ps"></label><label>To <input type="date" value="${S.pe}" data-s="pe"></label></div><div class="rep">${head('Profit and Loss Account · '+S.ps+' to '+S.pe)}<table>${secH('INCOME')}${a}${tot('Total income',A)}${secH('EXPENSES')}${b}${tot('Total expenses',B)}<tr class="tot"><td>NET PROFIT / (LOSS)</td><td class="r ${A-B>=0?'ok':'bad'}">${f(A-B)}</td><td></td></tr></table></div></div>`}
function vBS(){const L=led(null,S.bs),pr=profit(L),R=party(L,'Assets','Receivable from ').reduce((x,y)=>x+y[1],0),P=party(L,'Liabilities','Payable to ').reduce((x,y)=>x+y[1],0);
 const [a,A]=lines(L,'Assets',/^Receivable from /,[['Trade receivables',R]]),[l,Lt]=lines(L,'Liabilities',/^Payable to /,[['Trade payables',P]]),[e,E]=lines(L,'Equity',/^Current Year Profit/,[['Current year profit / (loss)',pr]]);const d=Math.round((A-Lt-E)*100)/100;
 return `<div class="card"><div class="set"><label>As at <input type="date" value="${S.bs}" data-s="bs"></label></div><div class="rep">${head('Balance Sheet · as at '+S.bs)}<table>${secH('ASSETS')}${a}${tot('Total assets',A)}${secH('LIABILITIES')}${l}${tot('Total liabilities',Lt)}${secH('EQUITY')}${e}${tot('Total equity',E)}${tot('Total liabilities + equity',Lt+E)}<tr><td>Check (assets − liabilities − equity)</td><td class="r ${d==0?'ok':'bad'}">${f(d)} ${d==0?'✓':'✗'}</td><td></td></tr></table></div></div>`}
function vTB(){const L=led();let Dr=0,Cr=0,o='';H.forEach(h=>{let r='';S.coa[h].forEach(s=>{const v=L[h+'|'+s]||0;if(Math.abs(v)<.005)return;r+=`<tr><td>${esc(s)}</td><td class="r">${v>0?f(v):''}</td><td class="r">${v<0?f(-v):''}</td></tr>`;v>0?Dr+=v:Cr-=v});if(r)o+=`<tr class="sec"><td colspan="3">${h.toUpperCase()}</td></tr>`+r});const d=Math.round((Dr-Cr)*100)/100;
 return `<div class="card rep">${head('Trial Balance Report')}<table><thead><tr><th>Account</th><th class="r">Debit</th><th class="r">Credit</th></tr></thead>${o}<tr class="tot"><td>TOTAL</td><td class="r">${f(Dr)}</td><td class="r">${f(Cr)}</td></tr><tr><td>Difference (must be 0)</td><td class="r ${d==0?'ok':'bad'}" colspan="2">${f(d)} ${d==0?'✓':'✗'}</td></tr></table></div>`}
const V={dash:vDash,bank:vBank,jr:vJr,coa:vCoa,rec:()=>vParty('Assets','Receivable from ','Receivables','Customer'),pay:()=>vParty('Liabilities','Payable to ','Payables','Supplier'),pl:vPL,bs:vBS,tb:vTB};
function draw(){$('#co').textContent=S.co+' · '+S.cur;$('#nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-v="${t[0]}" class="${t[0]==tab?'on':''}">${t[1]}</button>`).join('');app.innerHTML=V[tab]()}
// ---------- currency ----------
const CURS=['GBP','USD','EUR','PKR','AED','SAR','INR','CAD','AUD'];
const csym=c=>{try{return new Intl.NumberFormat('en-GB',{style:'currency',currency:c||S.cur,currencyDisplay:'narrowSymbol'}).formatToParts(0).find(p=>p.type=='currency').value}catch(e){return c||S.cur}};
const fm=v=>{const s=f(v);return s[0]=='('?'('+csym()+s.slice(1):csym()+s};
if(!S.curSet&&S.cur!='GBP'){S.cur='GBP';save()}
if(!CURS.includes(S.cur))CURS.push(S.cur);
$('#cur').innerHTML=CURS.map(c=>`<option value="${c}" ${c==S.cur?'selected':''}>${csym(c)} ${c}</option>`).join('');
$('#cur').onchange=e=>{S.cur=e.target.value;S.curSet=1;save();draw()};
// ---------- statement import ----------
const pD=v=>{if(typeof v=='number'&&v>20000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const s=String(v||'').trim();let m;
 if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
 if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))return(m[3].length==2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
 if(m=s.match(/^(\d{1,2})\s+([A-Za-z]{3})\w*\s+(\d{4})/)){const i=M.findIndex(x=>x.toLowerCase()==m[2].toLowerCase());if(i>=0)return m[3]+'-'+String(i+1).padStart(2,'0')+'-'+m[1].padStart(2,'0')}return''};
const pN=v=>{if(typeof v=='number')return v;let s=String(v||'').replace(/[^0-9.\-()]/g,'');if(/^\(.*\)$/.test(s))s='-'+s.slice(1,-1);const x=parseFloat(s);return isNaN(x)?0:x};
function impFile(file){if(typeof XLSX=='undefined')return alert('The import library could not load. Check your connection and try again.');const r=new FileReader();r.onload=()=>{try{
 const wb=XLSX.read(r.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true});
 const hi=rows.findIndex(x=>x.some(c=>/date/i.test(c))&&x.filter(c=>c!=='').length>=3);if(hi<0)return alert('Could not find a header row with a Date column.');
 const h=rows[hi].map(c=>String(c).toLowerCase()),fi=re=>h.findIndex(c=>re.test(c));
 const cD=fi(/date/),cO=fi(/paid out|money out|debit|withdraw|payment|\bout\b/),cI=fi(/paid in|money in|credit|deposit|received|\bin\b/),cA=fi(/amount/);let cT=fi(/desc|detail|narrat|memo|particular|reference|payee|name/);
 if(cT<0)cT=h.findIndex((c,i)=>i!=cD&&i!=cO&&i!=cI&&i!=cA);if(cO<0&&cI<0&&cA<0)return alert('Could not find amount columns (Paid/Received or Amount).');
 const known={};S.bank.forEach(t=>{if(t[1]&&t[4]&&t[5])known[t[1].toLowerCase()]=[t[4],t[5]]});
 const dIn=['Income',S.coa.Income.includes('Other Income')?'Other Income':S.coa.Income[0]],dOut=['Expenses',S.coa.Expenses.includes('Sundry Expenses')?'Sundry Expenses':S.coa.Expenses[0]];
 const have=new Set(S.bank.map(t=>[t[0],(t[1]||'').toLowerCase(),n(t[2]),n(t[3])].join('|')));let out=[],dup=0,ti=0,to=0;
 rows.slice(hi+1).forEach(x=>{let o=0,i=0;if(cO>=0||cI>=0){o=cO>=0?Math.abs(pN(x[cO])):0;i=cI>=0?Math.abs(pN(x[cI])):0}else{const a=pN(x[cA]);a<0?o=-a:i=a}
  if(!o&&!i)return;const d=pD(x[cD]),ds=String(x[cT]||'').trim(),k=known[ds.toLowerCase()]||(i?dIn:dOut);
  if(have.has([d,ds.toLowerCase(),o,i].join('|'))){dup++;return}out.push([d,ds,o||'',i||'',k[0],k[1]]);ti+=i;to+=o});
 if(!out.length)return alert('No new transactions found'+(dup?' ('+dup+' duplicates skipped).':'.'));
 if(!confirm('Import '+out.length+' transactions?\nMoney in: '+fm(ti)+'\nMoney out: '+fm(to)+(dup?'\nSkipped duplicates: '+dup:'')+'\n\nThey will be filed under Sundry Expenses / Other Income unless the description matches an earlier transaction — you can change any account afterwards.'))return;
 out.sort((a,b)=>a[0].localeCompare(b[0]));S.bank.push(...out);save();tab='bank';draw();app.querySelector('.tw').scrollTop=1e9;
}catch(err){alert('Could not read that file: '+err.message)}};r.readAsArrayBuffer(file)}
document.addEventListener('click',e=>{if(e.target.closest('[data-a=imp]'))$('#fi').click()});
document.addEventListener('change',e=>{if(e.target.id=='fi'&&e.target.files[0]){impFile(e.target.files[0]);e.target.value=''}});
app.addEventListener('change',e=>{const t=e.target,d=t.dataset;let v=d.num?(t.value===''?'':+t.value):t.value;
 if(d.t){const r=S[d.t][d.i];r[d.k]=v;const mk=d.t=='bank'?4:5;if(+d.k==mk)r[mk+1]=(S.coa[v]||[])[0]||''}
 else if(d.s)S[d.s]=v;else if(d.c)S.coa[d.c]=t.value.split('\n').map(x=>x.trim()).filter(Boolean);else return;save();draw()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;
 if(a=='tab'){tab=d.v;draw();scrollTo(0,0)}
 else if(a=='print')print();
 else if(a=='dark'){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark'}
 else if(a=='reset'){if(confirm('Replace everything with the original workbook data?')){S=clone(SEED);save();draw()}}
 else if(a=='addb'){S.bank.push(['','','','','Expenses',S.coa.Expenses[0]||'']);save();draw();app.querySelector('.tw').scrollTop=1e9}
 else if(a=='addj'||a=='addl'){const mx=Math.max(0,...S.jr.map(t=>n(t[0])));S.jr.push([a=='addj'?mx+1:mx,'','','Debit','','Expenses',S.coa.Expenses[0]||'']);save();draw();app.querySelector('.tw').scrollTop=1e9}
 else if(a=='del'){S[d.t].splice(+d.i,1);save();draw()}});
draw();
</script>
